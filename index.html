<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Armeebauer">
  <title>Epic Armeebauer</title>
  <script>
    // Apply the stored theme before first paint to avoid a flash.
    (function () {
      var t = localStorage.getItem("eab:theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="ui/style.css">
</head>
<body>
  <header class="bar">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
    <button id="lists" class="title" type="button" aria-label="Listen und Armeen"><h1><span id="army-name">Epic Armeebauer</span><small id="army-sub"></small></h1><span class="caret" aria-hidden="true">▾</span></button>
    <div class="bar-total"><strong id="total">0</strong> Pkt.</div>
    <button id="theme" class="icon ghost" type="button" aria-label="Design wechseln">◐</button>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-view="build" class="on">Bauen</button>
    <button type="button" role="tab" data-view="overview">Übersicht</button>
  </nav>

  <main id="app" aria-live="polite">Lade …</main>

  <footer class="actions">
    <button id="add" class="primary" type="button">+ Verband</button>
    <button id="sort" type="button">Sortieren</button>
    <button id="more" type="button" aria-label="Mehr">⋯</button>
  </footer>

  <dialog id="picker"></dialog>
  <div id="toast" role="status"></div>

  <script type="module" src="ui/app.js"></script>
</body>
</html>
