<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <title>Epic Armeebauer</title>
  <script>
    // Apply the stored theme before first paint to avoid a flash.
    (function () {
      var t = localStorage.getItem("eab:theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="ui/style.css">
</head>
<body>
  <header class="bar">
    <div class="logo" aria-hidden="true">⚔</div>
    <h1><span id="army-name">Epic Armeebauer</span><small id="army-sub"></small></h1>
    <div class="bar-total"><strong id="total">0</strong> Pkt.</div>
    <button id="theme" class="icon ghost" type="button" aria-label="Design wechseln">◐</button>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-view="build" class="on">Bauen</button>
    <button type="button" role="tab" data-view="overview">Übersicht</button>
  </nav>

  <main id="app" aria-live="polite">Lade …</main>

  <footer class="actions">
    <button id="add" class="primary" type="button">+ Verband</button>
    <button id="sort" type="button">Sortieren</button>
    <button id="more" type="button" aria-label="Mehr">⋯</button>
  </footer>

  <dialog id="picker"></dialog>
  <div id="toast" role="status"></div>

  <script type="module" src="ui/app.js"></script>
</body>
</html>
